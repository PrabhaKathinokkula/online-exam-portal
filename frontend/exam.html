<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam | Pro Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body style="background-color: #1a1a2e; font-family: sans-serif;">

    <!-- ✅ TIMER (corner, no UI change) -->
    <div id="timer-box" style="
        position: fixed;
        top: 20px;
        right: 20px;
        background: #00d2ff;
        color: black;
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: bold;
        font-size: 18px;
        z-index: 999;
    ">
        ⏱ 00:00
    </div>

    <div class="exam-header" style="text-align: center; padding: 40px 0;">
        <h1 id="exam-info" style="color: #00d2ff; margin-bottom: 10px;">Loading Exam...</h1>
    </div>

    <div id="quiz-area">
        <p style="text-align: center; color: white;">Fetching your questions...</p>
    </div>

    <script src="exam.js"></script>
</body>
</html>
